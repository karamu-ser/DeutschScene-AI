services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deutsch-lernen-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/database.db:/app/backend/database.db
      - ./backend/logs:/app/backend/logs
      - ./backend/uploads:/app/backend/uploads
    networks:
      - deutsch-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deutsch-lernen-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    networks:
      - deutsch-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  deutsch-network:
    driver: bridge
